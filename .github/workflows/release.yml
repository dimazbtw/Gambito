# Builds the Windows installer. Run it by hand (Actions > Release > Run workflow) or push a tag like v1.0.0,
# which also publishes the installer as a GitHub Release asset.
name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Download the engines (only the tests use them; the installer downloads them on the user's PC)"
        shell: powershell
        run: ./scripts/fetch-engines.ps1
      - name: Tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: "Installer (the same exe, named *Setup*, so it shows the setup screen: see src/setup.rs)"
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/gambito.exe dist/Gambito-Setup.exe
          # the app only installs an update whose SHA-256 is listed here (src/update.rs)
          "$((Get-FileHash dist/Gambito-Setup.exe -Algorithm SHA256).Hash.ToLower())  Gambito-Setup.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gambito-Setup
          path: |
            dist/Gambito-Setup.exe
            dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'v1.0.0' && 'Gambito 1.0 - stable' || format('Gambito {0}', github.ref_name) }}
          body_path: .github/release-notes.md
          make_latest: true
          files: |
            dist/Gambito-Setup.exe
            dist/SHA256SUMS.txt
      # One time only: v1.0.0 is the first stable release, so the earlier test releases and tags are removed.
      # (It does nothing for any other tag. Delete this step once v1.0.0 is out.)
      - name: Remove the earlier test releases and tags
        if: github.ref_name == 'v1.0.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "v1.0.0" ]; then gh release delete "$tag" --yes || true; fi
          done
          for ref in $(gh api "repos/${{ github.repository }}/git/matching-refs/tags" --jq '.[].ref'); do
            if [ "$ref" != "refs/tags/v1.0.0" ]; then gh api -X DELETE "repos/${{ github.repository }}/git/$ref" || true; fi
          done
