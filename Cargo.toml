[package]
name = "gambito"
version = "1.0.0"
edition = "2024"
description = "Tabuleiro de xadrez para treinar e analisar, com várias engines, sugestões explicadas e avaliação de partidas"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
arboard = "3.7.0"
eframe = "0.37.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.50.0"
rfd = "0.18.0"
serde_json = "1.0.154"
shakmaty = "0.30.2"
ureq = "3.5.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
